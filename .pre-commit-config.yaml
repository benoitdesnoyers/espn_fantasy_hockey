# Install once with `pip install pre-commit && pre-commit install`; the hooks then
# run on every commit. `pre-commit run --all-files` checks the whole repository.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types_or: [javascript, json, markdown, yaml]
      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        types: [javascript]
